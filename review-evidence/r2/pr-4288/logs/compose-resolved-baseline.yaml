name: higress-pr4288-r2-runtime
services:
  envoy:
    command:
      - -c
      - /etc/envoy/envoy.yaml
      - --component-log-level
      - wasm:debug
    depends_on:
      mock-gemini:
        condition: service_started
        required: true
    entrypoint:
      - /usr/local/bin/envoy
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/gateway@sha256:93e4da97560d00871299e67163df4f1801732aeea4934a9cea841f9e7b4a26e8
    init: true
    networks:
      pr4288-host: null
      pr4288-internal: null
    ports:
      - host_ip: 127.0.0.1
        target: 10000
        published: "11088"
        protocol: tcp
      - host_ip: 127.0.0.1
        target: 9901
        published: "19988"
        protocol: tcp
    restart: "no"
    volumes:
      - type: bind
        source: <workspace>/pr-drafts/runtime-4288-r2/envoy.yaml
        target: /etc/envoy/envoy.yaml
        read_only: true
      - type: bind
        source: <workspace>/pr-drafts/runtime-4288-r2/ai-proxy-baseline.wasm
        target: /etc/envoy/main.wasm
        read_only: true
  mock-gemini:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    init: true
    networks:
      pr4288-internal: null
    restart: "no"
    volumes:
      - type: bind
        source: <workspace>/pr-drafts/runtime-4288-r2/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: <workspace>/pr-drafts/runtime-4288-r2/gemini-response.json
        target: /usr/share/nginx/html/gemini-response.json
        read_only: true
networks:
  pr4288-host:
    name: higress-pr4288-r2-runtime_pr4288-host
  pr4288-internal:
    name: higress-pr4288-r2-runtime_pr4288-internal
    internal: true

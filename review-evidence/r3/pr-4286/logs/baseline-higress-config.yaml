    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: higress-gateway
    app.kubernetes.io/version: 2.2.4
    helm.sh/chart: higress-core-2.2.4
    higress: higress-system-higress-gateway
  name: higress-config
  namespace: higress-system

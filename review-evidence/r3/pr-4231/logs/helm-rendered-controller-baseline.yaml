---
# Source: higress-core/templates/controller-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: higress-controller
  namespace: higress-system
  labels:
    helm.sh/chart: higress-core-2.2.4
    app: higress-controller
    higress: higress-controller
    app.kubernetes.io/version: "2.2.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: higress-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: higress-controller
      higress: higress-controller
  template:
    metadata:
      labels:
        app: higress-controller
        higress: higress-controller
    spec:
      serviceAccountName: higress-controller
      securityContext:
        {}
      containers:
        - name: higress-core
          securityContext:
            {}
          image: "higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/higress:pr4231-r3-baseline-409b3ed2"
          imagePullPolicy: IfNotPresent
          args:
          - "serve"
          - --gatewaySelectorKey=higress
          - --gatewaySelectorValue=higress-system-higress-gateway
          - --gatewayHttpPort=80
          - --gatewayHttpsPort=443
          - --ingressClass=higress
          - --gatewayClass=higress
          - --enableAutomaticHttps=true
          - --automaticHttpsEmail=
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: SERVICE_ACCOUNT
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: spec.serviceAccountName
          - name: DOMAIN_SUFFIX
            value: cluster.local
          - name: GATEWAY_NAME
            value: higress-gateway
          - name: PILOT_ENABLE_GATEWAY_API
            value: "true"
          - name: PILOT_ENABLE_GATEWAY_API_DEPLOYMENT_CONTROLLER
            value: "false"
          - name: PILOT_ENABLE_ALPHA_GATEWAY_API
            value: "false"
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
            - name: http-solver
              containerPort: 8889
              protocol: TCP
            - name: grpc
              containerPort: 15051
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8888
            initialDelaySeconds: 1
            periodSeconds: 3
            timeoutSeconds: 5
          volumeMounts:
          - name: log
            mountPath: /var/log
        - name: discovery
          image: "higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/pilot:v2.2.4"
          imagePullPolicy: IfNotPresent
          args:
          - "discovery"
          - --monitoringAddr=:15014
          - --log_output_level=default:info
          - --domain
          - cluster.local
          - --keepaliveMaxServerConnectionAge
          - "30m"
          ports:
          - containerPort: 8080
            protocol: TCP
          - containerPort: 15010
            protocol: TCP
          - containerPort: 15017
            protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 3
            timeoutSeconds: 5
          env:
          - name: ENABLE_PUSH_ALL_MCP_CLUSTERS
            value: "true"
          - name: PILOT_ENABLE_LDS_CACHE
            value: "false"
          - name: PILOT_ENABLE_QUIC_LISTENERS
            value: "true"
          - name: VALIDATION_WEBHOOK_CONFIG_NAME
            value: ""
          - name: ISTIO_DUAL_STACK
            value: "false"
          - name: PILOT_ENABLE_HEADLESS_SERVICE_POD_LISTENERS
            value: "false"
          - name: PILOT_ENABLE_ALPN_FILTER
            value: "false"
          - name: ENABLE_OPTIMIZED_CONFIG_REBUILD
            value: "false"
          - name: PILOT_ENABLE_K8S_SELECT_WORKLOAD_ENTRIES
            value: "false"
          - name: HIGRESS_SYSTEM_NS
            value: "higress-system"
          - name: DEFAULT_UPSTREAM_CONCURRENCY_THRESHOLD
            value: "10000"
          - name: ISTIO_GPRC_MAXRECVMSGSIZE
            value: "104857600"
          - name: ENBALE_SCOPED_RDS
            value: "true"
          - name: ISTIO_DELTA_XDS
            value: "true"
          - name: ON_DEMAND_RDS
            value: "false"
          - name: HOST_RDS_MERGE_SUBSET
            value: "false"
          - name: PILOT_FILTER_GATEWAY_CLUSTER_CONFIG
            value: "true"
          - name: HIGRESS_CONTROLLER_SVC
            value: "127.0.0.1"
          - name: HIGRESS_CONTROLLER_PORT
            value: "15051"
          - name: REVISION
            value: "default"
          - name: JWT_POLICY
            value: third-party-jwt
          - name: PILOT_CERT_PROVIDER
            value: "istiod"
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: SERVICE_ACCOUNT
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: spec.serviceAccountName
          - name: KUBECONFIG
            value: /var/run/secrets/remote/config
          - name: PRIORITIZED_LEADER_ELECTION
            value: "false"
          - name: INJECT_ENABLED
            value: "false"
          - name: PILOT_ENABLE_CROSS_CLUSTER_WORKLOAD_ENTRY
            value: "false"
          - name: PILOT_ENABLE_METADATA_EXCHANGE
            value: "false"
          - name: PILOT_SCOPE_GATEWAY_TO_NAMESPACE
            value: "false"
          - name: VALIDATION_ENABLED
            value: "false"
          - name: PILOT_TRACE_SAMPLING
            value: "1"
          - name: PILOT_ENABLE_PROTOCOL_SNIFFING_FOR_OUTBOUND
            value: "true"
          - name: PILOT_ENABLE_PROTOCOL_SNIFFING_FOR_INBOUND
            value: "true"
          - name: ISTIOD_ADDR
            value: istiod.higress-system.svc:15012
          - name: PILOT_ENABLE_ANALYSIS
            value: "false"
          - name: CLUSTER_ID
            value: "Kubernetes"
          # HIGRESS_ENABLE_ISTIO_API is only used to restart the controller pod after the config change
          - name: HIGRESS_ENABLE_ISTIO_API
            value: "true"
          - name: PILOT_ENABLE_GATEWAY_API
            value: "false"
          - name: PILOT_ENABLE_ALPHA_GATEWAY_API
            value: "false"
          - name: PILOT_ENABLE_GATEWAY_API_STATUS
            value: "false"
          - name: PILOT_ENABLE_GATEWAY_API_DEPLOYMENT_CONTROLLER
            value: "false"
          - name: CUSTOM_CA_CERT_NAME
            value: "higress-ca-root-cert"
          securityContext:
            readOnlyRootFilesystem: true
            runAsUser: 1337
            runAsGroup: 1337
            runAsNonRoot: true
            capabilities:
              drop:
              - ALL
          volumeMounts:
          - name: config
            mountPath: /etc/istio/config
          - name: istio-token
            mountPath: /var/run/secrets/tokens
            readOnly: true
          - name: local-certs
            mountPath: /var/run/secrets/istio-dns
          - name: cacerts
            mountPath: /etc/cacerts
            readOnly: true
          - name: istio-kubeconfig
            mountPath: /var/run/secrets/remote
            readOnly: true
      volumes:
      - name: log
        emptyDir: {}
      - name: config
        configMap:
          name: higress-config
      # Technically not needed on this pod - but it helps debugging/testing SDS
      # Should be removed after everything works.
      - emptyDir:
          medium: Memory
        name: local-certs
      - name: istio-token
        projected:
          sources:
            - serviceAccountToken:
                audience: istio-ca
                expirationSeconds: 43200
                path: istio-token
      # Optional: user-generated root
      - name: cacerts
        secret:
          secretName: cacerts
          optional: true
      - name: istio-kubeconfig
        secret:
          secretName: istio-kubeconfig
          optional: true
